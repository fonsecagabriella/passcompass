name: Test, Lint & Deploy
on: [push, pull_request]

jobs:
  # ---------- CI ----------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: black --check .
      - run: ruff check .
      - run: pytest -q

  # ---------- Did webapp/ change? ----------
  changes:
    runs-on: ubuntu-latest
    # we only need this on pushes; PRs already show preview builds if you have them
    if: github.event_name == 'push'
    outputs:
      webapp_changed: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3   # <-- zero-config diff checker
        with:
          filters: |
            webapp:
              - 'webapp/**'

  # ---------- CD ----------
  deploy:
    needs: [quality, changes]
    # - main branch AND webapp actually changed
    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.webapp_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}-web:latest
