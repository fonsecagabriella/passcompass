[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]                # global settings
line-length    = 100
target-version = "py310"
exclude        = ["00_exploration", "01_pipelines/_archive"]

# Lint rules: see https://docs.astral.sh/ruff/rules/
[tool.ruff.lint] 
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "B",  # bugbear
  "S",  # bandit-style security
]
ignore = ["E501", "S101", "S104", "S108", "S301", "S310", "E402"]


# --- optional: enable Ruff’s Black-compatible formatter instead of Black ---
# [tool.ruff.format]
# docstring-code-format = true
