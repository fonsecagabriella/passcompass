<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PassCompass 🎓 Predictor</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <main class="card">
    <h1><span>PassCompass</span> — Pass / Fail Predictor</h1>

    <!-- form groups inserted by JS -->
    <form id="form"></form>

    <button type="submit" form="form" id="predictBtn" class="btn">
      <span class="btn-label">Predict</span>
      <span class="spinner hidden"></span>
    </button>

    <section id="out" class="result hidden"></section>
  </main>

  <footer>
    Built with ❤️ and MLflow
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
